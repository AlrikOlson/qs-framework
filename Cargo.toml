# Shared rendering, text and UI libraries.
[workspace]
resolver = "3"
members = [
    "crates/qs-platform",
    "crates/qs-gpu",
    "crates/qs-text",
    "crates/qs-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# wgpu 30 requires Rust 1.87 or later.
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/AlrikOlson/qs-framework"
publish = false

[workspace.dependencies]
# --- rendering -------------------------------------------------------------
wgpu = "30.0"
wgpu-hal = "30.0"
# Use the same shader compiler version as wgpu for validation tests.
naga = { version = "30.0", features = ["wgsl-in"] }
raw-window-handle = "0.6"
bytemuck = { version = "1.19", features = ["derive"] }

# --- windowing / input -----------------------------------------------------
winit = "0.30"

# --- accessibility ---------------------------------------------------------
# Keep winit, accesskit and accesskit_winit versions aligned in applications
# that also depend on these libraries.
accesskit = "0.24"
accesskit_winit = "0.33"

# --- text ------------------------------------------------------------------
rustybuzz = "0.20"
swash = "0.2"
unicode-bidi = "0.3"
unicode-script = "0.5"
ttf-parser = "0.25"

# --- cpu raster ------------------------------------------------------------
tiny-skia = "0.12"

# --- serialization ---------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- misc ------------------------------------------------------------------
tracing = "0.1"
thiserror = "2.0"
pollster = "1.0"

# --- dev / test ------------------------------------------------------------
proptest = "1.5"
loom = "0.7"

# --- internal --------------------------------------------------------------
qs-platform = { path = "crates/qs-platform" }
qs-gpu = { path = "crates/qs-gpu" }
qs-text = { path = "crates/qs-text" }
qs-ui = { path = "crates/qs-ui" }

# Keep panics out of the frame path.
# Tests and initialization code can opt out locally where needed.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
indexing_slicing = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
# `loom` is enabled by `RUSTFLAGS="--cfg loom"`, not by a Cargo feature, because loom has to
# replace std's atomics across the whole dependency graph of the test binary.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# Release build settings.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

# Optimize dependencies for rendering in development builds.
[profile.dev.package."*"]
opt-level = 2
