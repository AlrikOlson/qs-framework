[package]
name = "qs-gpu"
description = "GPU and CPU rendering, draw lists, effects and glyph atlases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
pollster.workspace = true
qs-text.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tracing.workspace = true
wgpu.workspace = true

[dev-dependencies]
naga.workspace = true
pollster.workspace = true

# `loom` replaces std's atomics under `cfg(loom)` and must not be linked into a
# normal build. The handoff test is run with
# `RUSTFLAGS="--cfg loom" cargo test -p qs-gpu --test loom_handoff`.
[target.'cfg(loom)'.dependencies]
loom.workspace = true

