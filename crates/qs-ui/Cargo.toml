[package]
name = "qs-ui"
description = "List layout, scrolling, materials, animation and accessibility."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit.workspace = true
qs-gpu.workspace = true
qs-text.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
# Examples only, to encode a PNG. `CpuRasterizer::render` leaves a linear premultiplied
# buffer and `to_srgb_rgba8` is what makes it displayable, so a looking harness has to
# build its own pixmap from those bytes rather than saving the working one.
tiny-skia.workspace = true
# `gpu_strip` only. The CPU harness cannot show an `Enhanced` primitive at all -- `cpu_floor`
# drops it before tiny-skia is reached -- so the one way to look at a glow or a rim is to run
# the real WGSL on a real adapter and read the texture back.
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true

[lints]
workspace = true
